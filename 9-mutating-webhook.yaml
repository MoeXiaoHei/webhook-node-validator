apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: node-selector-webhook
  labels:
    app: node-validation-webhook
webhooks:
- name: node-selector.my-namespace.svc
  clientConfig:
    service:
      name: webhook-service
      namespace: my-namespace
      path: "/mutate"
      port: 443
    caBundle: <BASE64_ENCODED_CA_CERT>
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
    scope: "Namespaced"
  admissionReviewVersions: ["v1"]
  sideEffects: None
  timeoutSeconds: 5
  failurePolicy: Fail
  namespaceSelector:
    matchLabels:
      webhook-enabled: "true"
