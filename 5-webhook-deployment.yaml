apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-validation-webhook
  namespace: my-namespace
  labels:
    app: node-validation-webhook
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: node-validation-webhook
  template:
    metadata:
      labels:
        app: node-validation-webhook
    spec:
      serviceAccountName: webhook-sa
      containers:
      - name: webhook
        image: webhook-node-validator:latest
        env:
        - name: ALLOWED_NODES
          value: "node01,node02"  #修改为你的白名单节点
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8443
          name: https
        volumeMounts:
        - name: webhook-tls
          mountPath: /app/certs
          readOnly: true
        - name: webhook-code
          mountPath: /app/webhook.py
          subPath: webhook.py
        livenessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10       
          timeoutSeconds: 5
          failureThreshold: 5              
        readinessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 20     
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: webhook-tls
        secret:
          secretName: webhook-tls
          defaultMode: 0400
      - name: webhook-code
        configMap:
          name: webhook-code
          defaultMode: 0755
