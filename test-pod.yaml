# test-pod-allowed.yaml - 在允许的节点上创建
apiVersion: v1
kind: Pod
metadata:
  name: test-allowed-pod
  namespace: my-namespace
spec:
  nodeName: node-01  # 允许的节点
  containers:
  - name: nginx
    image: nginx:latest
---
# test-pod-denied.yaml - 在不允许的节点上创建
apiVersion: v1
kind: Pod
metadata:
  name: test-denied-pod
  namespace: my-namespace
spec:
  nodeName: node-03  # 不允许的节点
  containers:
  - name: nginx
    image: nginx:latest
