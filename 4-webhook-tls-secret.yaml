apiVersion: v1
kind: Secret
metadata:
  name: webhook-tls
  namespace: my-namespace
type: kubernetes.io/tls
data:
  # 以下值需要从 certs 目录读取并 base64 编码
  # 使用命令: cat certs/webhook.crt | base64 | tr -d '\n'
  tls.crt: <BASE64_ENCODED_CERT>
  # 使用命令: cat certs/webhook.key | base64 | tr -d '\n'
  tls.key: <BASE64_ENCODED_KEY>
  # CA 证书需要单独存储，用于 ValidatingWebhookConfiguration
  ca.crt: <BASE64_ENCODED_CA>
