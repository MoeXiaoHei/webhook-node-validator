apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-code
  namespace: my-namespace
data:
  webhook.py: |
    #!/usr/bin/env python3
    import json
    import logging
    import os
    import base64
    import random
    from flask import Flask, request, jsonify

    app = Flask(__name__)
    logging.basicConfig(level=logging.INFO)

    # 从环境变量读取允许的节点列表
    ALLOWED_NODES = os.getenv("ALLOWED_NODES", "node01,node02").split(",")
    ALLOWED_NODES = [node.strip() for node in ALLOWED_NODES if node.strip()]

    # 需要检查的操作类型
    POD_OPERATIONS = ["CREATE", "UPDATE", "DELETE"]

    @app.route('/health', methods=['GET'])
    def health():
        return jsonify({"status": "healthy", "allowed_nodes": ALLOWED_NODES})

    @app.route('/mutate', methods=['POST'])
    def mutate():
        """
        Mutating Webhook: 自动注入 nodeSelector，让 Kubernetes 调度器选择节点
        """
        try:
            review = request.get_json()
            request_info = review.get('request', {})
            operation = request_info.get('operation')
            
            # 只处理 CREATE 操作
            if operation != "CREATE":
                return allow("Not a CREATE operation")
            
            pod = request_info.get('object', {})
            spec = pod.get('spec', {})
            metadata = pod.get('metadata', {})
            pod_name = metadata.get('name', 'unknown')
            
            # 检查是否指定了 nodeName
            node_name = spec.get('nodeName')
            
            logging.info(f"Processing Pod: {pod_name}, nodeName: {node_name}")
            
            # 🔑 如果用户指定了 nodeName，检查是否在白名单中
            if node_name:
                if node_name not in ALLOWED_NODES:
                    return deny(f"Node '{node_name}' is not allowed. Allowed nodes: {', '.join(ALLOWED_NODES)}")
                # 指定了白名单节点，不需要注入 nodeSelector
                logging.info(f"Pod {pod_name} uses allowed node: {node_name}")
                return allow(f"Pod scheduled on allowed node: {node_name}")
            
            # 🔑 关键修改：如果没有指定 nodeName
            # 不注入 nodeName，只注入 nodeSelector
            # 让 Kubernetes 调度器来决定调度到哪个白名单节点
            logging.info(f"Pod {pod_name} has no nodeName, injecting nodeSelector: node-group=allowed")
            
            # 检查是否已有 nodeSelector
            node_selector = spec.get('nodeSelector', {})
            
            # 添加节点选择器（如果用户没有指定）
            if 'node-group' not in node_selector:
                node_selector['node-group'] = 'allowed'
                logging.info(f"Injected nodeSelector: {node_selector}")
            
            # 构建 JSON Patch
            patch = [
                {
                    "op": "add",
                    "path": "/spec/nodeSelector",
                    "value": node_selector
                }
            ]
            
            # 编码 patch
            patch_bytes = json.dumps(patch).encode('utf-8')
            patch_base64 = base64.b64encode(patch_bytes).decode('utf-8')
            
            return jsonify({
                "apiVersion": "admission.k8s.io/v1",
                "kind": "AdmissionReview",
                "response": {
                    "uid": request_info.get('uid', ''),
                    "allowed": True,
                    "patchType": "JSONPatch",
                    "patch": patch_base64
                }
            })
            
        except Exception as e:
            logging.error(f"Error in mutate: {str(e)}")
            return deny(f"Internal error: {str(e)}")

    @app.route('/validate', methods=['POST'])
    def validate():
        """
        Validating Webhook: 检查 Pod 是否在白名单节点上
        """
        try:
            review = request.get_json()
            request_info = review.get('request', {})
            operation = request_info.get('operation')
            resource = request_info.get('resource', {})
            
            # 只检查 Pod 资源
            if resource.get('resource') != 'pods':
                return allow("Not a Pod resource")
            
            # 如果是 DELETE 操作，从 oldObject 获取 Pod 信息
            if operation == "DELETE":
                pod = review['request'].get('oldObject', {})
            else:
                pod = review['request'].get('object', {})
            
            spec = pod.get('spec', {})
            node_name = spec.get('nodeName')
            
            # 如果指定了 nodeName，检查是否在白名单中
            if node_name and node_name not in ALLOWED_NODES:
                return deny(f"Node '{node_name}' is not allowed. Allowed nodes: {', '.join(ALLOWED_NODES)}")
            
            # 如果没有指定 nodeName，检查是否有 nodeSelector
            if not node_name:
                node_selector = spec.get('nodeSelector', {})
                if not node_selector or 'node-group' not in node_selector:
                    logging.warning("Pod without nodeName and nodeSelector, will be scheduled by default scheduler")
                    # 允许通过，调度器会选择节点
                    return allow("Pod without nodeName and nodeSelector - allowed")
            
            # 如果是 UPDATE 操作，检查是否试图修改 nodeName
            if operation == "UPDATE":
                old_pod = review['request'].get('oldObject', {})
                old_spec = old_pod.get('spec', {})
                old_node = old_spec.get('nodeName')
                
                if old_node and old_node != node_name:
                    return deny(f"Cannot change nodeName from '{old_node}' to '{node_name}' after Pod creation")
            
            return allow("Pod is allowed")
            
        except Exception as e:
            logging.error(f"Error in validate: {str(e)}")
            return deny(f"Internal error: {str(e)}")

    def allow(message):
        """返回允许的 AdmissionResponse"""
        return jsonify({
            "apiVersion": "admission.k8s.io/v1",
            "kind": "AdmissionReview",
            "response": {
                "uid": request.json.get('request', {}).get('uid', ''),
                "allowed": True,
                "status": {"message": message}
            }
        })

    def deny(message):
        """返回拒绝的 AdmissionResponse"""
        return jsonify({
            "apiVersion": "admission.k8s.io/v1",
            "kind": "AdmissionReview",
            "response": {
                "uid": request.json.get('request', {}).get('uid', ''),
                "allowed": False,
                "status": {"message": message, "code": 403}
            }
        })

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=8080)
